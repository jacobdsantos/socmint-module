[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socmint"
version = "0.1.0"
description = "Evidence-first SOCMINT module for topic tracking, multilingual narrative grouping, coordination candidates, and claim review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "yt-dlp>=2026.10.26",
  "ddgs>=9.5",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.9",
  "langdetect>=1.0.9",
  "scikit-learn>=1.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0",
  "torch>=2.4",
]
ui = [
  "streamlit>=1.40",
  "plotly>=5.24",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
socmint = "socmint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/socmint"]

[tool.hatch.build.targets.wheel.force-include]
"src/socmint/fixtures" = "socmint/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests that require live network access (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
