[theme]
base = "dark"
primaryColor = "#E8234A"
backgroundColor = "#070B22"
secondaryBackgroundColor = "#0C1132"
textColor = "#E6E9F5"
font = "sans serif"

[server]
address = "127.0.0.1"
port = 8511
headless = true

[browser]
gatherUsageStats = false

# Hide Streamlit's own chrome (Deploy button, overflow menu). It is developer
# furniture, not part of the case workbench, and it competes with the masthead.
[client]
toolbarMode = "minimal"
